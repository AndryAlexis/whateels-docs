name: Update Docs Context

on:
  push:
    branches:
      - vanessa-way
    paths:
      - 'whateels-docs/src/assets/pages/**'
  workflow_dispatch: {}

jobs:
  update-docs-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Gather changed markdown files
        id: gather
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            find whateels-docs/src/assets/pages -name "*.md" > /tmp/changed_files.txt
          else
            git diff --name-only HEAD~1 HEAD -- whateels-docs/src/assets/pages/ \
              | grep '\.md$' > /tmp/changed_files.txt || true
          fi
          echo "Files to update:"
          cat /tmp/changed_files.txt

      - name: Delete removed categories from docs API
        if: github.event_name == 'push'
        run: |
          # git ls-tree output format: "<mode> <type> <hash>TAB<fullpath>"
          # cut -f2 extracts the full path (tab-delimited, preserves spaces).
          # basename then strips the prefix, leaving just the folder name.
          git ls-tree HEAD~1 "whateels-docs/src/assets/pages/" 2>/dev/null \
            | grep '^040000' \
            | cut -f2 \
            | while IFS= read -r p; do basename "$p"; done \
            > /tmp/prev_cats.txt || touch /tmp/prev_cats.txt

          # Bare names from the current working tree
          find whateels-docs/src/assets/pages/ -mindepth 1 -maxdepth 1 -type d \
            -exec basename {} \; > /tmp/curr_cats.txt 2>/dev/null || touch /tmp/curr_cats.txt

          echo "Previous categories:"; cat /tmp/prev_cats.txt
          echo "Current  categories:"; cat /tmp/curr_cats.txt

          while IFS= read -r cat; do
            [ -z "$cat" ] && continue
            if ! grep -qxF "$cat" /tmp/curr_cats.txt; then
              ENCODED=$(printf '%s' "$cat" | jq -Rr @uri)
              echo "Category removed: '$cat' — calling DELETE /docs?field=$ENCODED"
              curl -f -s -X DELETE \
                "https://whateels-docs-api.onrender.com/docs?field=${ENCODED}" \
                && echo "✓ '$cat' deleted from Firestore" \
                || echo "✗ Delete failed for '$cat'"
            fi
          done < /tmp/prev_cats.txt

      - name: Post changed files to docs API
        run: |
          payload='{}'

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ -f "$file" ] || continue

            CATEGORY=$(basename "$(dirname "$file")")
            PAGENAME=$(basename "$file" .md)
            CONTENT=$(cat "$file")

            echo "Adding: $CATEGORY / $PAGENAME"
            payload=$(echo "$payload" | jq \
              --arg cat "$CATEGORY" \
              --arg page "$PAGENAME" \
              --arg content "$CONTENT" \
              '.[$cat][$page] = $content')
          done < /tmp/changed_files.txt

          echo "Payload preview:"
          echo "$payload" | jq 'to_entries | map({key, pages: (.value | keys)}) '

          echo "Posting to API..."
          curl -f -s -X POST "https://whateels-docs-api.onrender.com/docs" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            && echo "✓ Docs context saved" || echo "✗ Post failed"
