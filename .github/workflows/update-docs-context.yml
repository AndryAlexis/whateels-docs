name: Update Docs Context

on:
  push:
    branches:
      - vanessa-way
    paths:
      - 'whateels-docs/src/assets/pages/**'
  workflow_dispatch: {}

jobs:
  update-docs-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Gather changed markdown files
        id: gather
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            find whateels-docs/src/assets/pages -name "*.md" > /tmp/changed_files.txt
          else
            git diff --name-only HEAD~1 HEAD -- whateels-docs/src/assets/pages/ \
              | grep '\.md$' > /tmp/changed_files.txt || true
          fi
          echo "Files to update:"
          cat /tmp/changed_files.txt

      - name: Post changed files to docs API
        run: |
          payload='{}'

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ -f "$file" ] || continue

            CATEGORY=$(basename "$(dirname "$file")")
            PAGENAME=$(basename "$file" .md)
            CONTENT=$(cat "$file")

            echo "Adding: $CATEGORY / $PAGENAME"
            payload=$(echo "$payload" | jq \
              --arg cat "$CATEGORY" \
              --arg page "$PAGENAME" \
              --arg content "$CONTENT" \
              '.[$cat][$page] = $content')
          done < /tmp/changed_files.txt

          echo "Payload preview:"
          echo "$payload" | jq 'to_entries | map({key, pages: (.value | keys)}) '

          echo "Posting to API..."
          curl -f -s -X POST "https://whateels-docs-api.onrender.com/docs" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            && echo "✓ Docs context saved" || echo "✗ Post failed"
