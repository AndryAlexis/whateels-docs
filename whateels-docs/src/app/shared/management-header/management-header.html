<nav>
    <ul>
        <li>
            <button class="menu-button" (click)="managementSidebarService.open()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </li>
        <li>
            <a href="./">
                <app-logo [width]="30" [height]="30"></app-logo>
            </a>
        </li>
        <li>
            <div class="search-input-container">
                <input type="text" placeholder="Search page by ID, title or slug"/>
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        <li>
            <ul class="extra-options">
                <li>
                    <div class="github-names">
                        <span>{{ authService.getGithubUsername() }}</span>
                        <span>{{ authService.getGithubDisplayName() }}</span>
                    </div>
                    <div class="floating-menu-container">
                        <button (click)="managementFloatingMenuService.toggle()">
                            <img [src]="'https://avatars.githubusercontent.com/u/' + authService.getGithubId() + '?v=4&size=64'" alt="Github Avatar" class="avatar">
                        </button>
                        @if (managementFloatingMenuService.isOpen()) {
                            <div class="floating-menu">
                                <a href="/auth/callback?action=change-account">
                                    <span>
                                        Switch
                                    </span>
                                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                                </a>
                                <a href="/auth/callback?action=logout">
                                    <span>
                                        Logout
                                    </span>
                                    <i class="fa-solid fa-right-from-bracket"></i>
                                </a>
                            </div>
                        }
                    </div>
                </li>
            </ul>
        </li>
    </ul>
</nav>
