<div class="search-container">
    <div class="search-input">
        <i class="fas fa-search" aria-hidden="true"></i>
        <input
            #searchInput
            [ngModel]="searchQuery"
            (keydown)="onKeydown($event)"
            type="text"
            placeholder="Find something..."
            autocomplete="off"
            role="combobox"
            aria-label="Search documentation"
            aria-haspopup="listbox"
            aria-autocomplete="list"
            aria-controls="search-results-list"
        />
    </div>
    <div class="search-results">
        <nav class="results" (mouseleave)="onResultsMouseLeave()">
            <ul id="search-results-list" role="listbox" aria-label="Search results">
                <li
                    class="result-item"
                    role="option"
                >
                    <a [routerLink]="['/']" (click)="searchModalService.close()">
                        <p>
                            lorem ipsum dolor sit amet consectetur adipisicing elit. Doloribus, voluptate?
                        </p>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>
<div class="background" (click)="searchModalService.close()" aria-hidden="true"></div>
