<aside>
    <nav>
        <ul>
            <li>
                <h4>
                    On this page
                </h4>
            </li>
            @if (sections().length === 0) {
                <li>
                    <p>No sections found.</p>
                </li>
            }
            @else {
                @for (section of sections(); track section.id) {
                    @let slug = section.heading | slugify;
                    <li>
                        <a [routerLink]="[]" [fragment]="slug" [class.active]="isActive(slug)">{{ section.heading }}</a>
                    </li>
                }
            }
        </ul>
    </nav>
</aside>
