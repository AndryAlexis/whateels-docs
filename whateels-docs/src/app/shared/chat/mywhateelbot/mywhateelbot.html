<article class="chat">
    <header class="chat-header">
        <h6>WhatEELBot</h6>
        <button (click)="closeChat()">
            <i class="fa-solid fa-window-minimize"></i>
        </button>
    </header>
    <main class="chat-body">
        <div class="eelbot-bubble">
            <p>Hello! I'm WhatEELBot, your friendly documentation assistant. How can I help you today?</p>
        </div>
        <!-- <div class="user-bubble">
            <p>Can you tell me more about the API?</p>
        </div> -->
    </main>
    <footer class="chat-footer">
        <div class="suggestions">
            <button>What can I ask you?</button>
            <button (click)="openEmailAdmin()">I'd rather to email the admin</button>
        </div>
        <div class="input-group">
            <input type="text" placeholder="Type a message...">
            <button>
                <i class="fa-regular fa-paper-plane"></i>        
            </button>
        </div>
    </footer>
</article>
