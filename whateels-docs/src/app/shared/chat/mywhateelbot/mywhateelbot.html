<article class="chat">
    <header class="chat-header">
        <h6>WhatEELBot</h6>
        <button (click)="closeChat()">
            <i class="fa-solid fa-window-minimize"></i>
        </button>
    </header>
    <main class="chat-body" #chatBody>
        <div class="chat-messages">
            @for (message of messages(); track message.id) {
                <div
                    class="message-bubble"
                    [class.whateelbot-bubble]="message.role === 'bot'"
                    [class.user-bubble]="message.role === 'user'"
                    [class.thinking]="message.status === 'thinking'"
                    [class.error]="message.status === 'error'"
                >
                    @if (message.role === 'bot' && message.status === 'thinking') {
                        <span class="loading-spinner"></span>
                    }
                    <p>{{ message.text }}</p>
                </div>
            }
        </div>
    </main>
    <footer class="chat-footer">
        <div class="suggestions">
            <button>What can I ask you?</button>
            @if (showEmailAdminSuggestion()) {
                <button (click)="openEmailAdmin()">{{ emailAdminActionLabel }}</button>
            }
        </div>
        <form class="input-group" (submit)="sendMessage($event)">
            <div class="text-input-container">
                <textarea
                    #messageInput
                    placeholder="Type a message..."
                    [attr.maxlength]="messageMaxLength"
                    (input)="onDraftMessageChange($event)"
                    (keydown)="onInputKeydown($event)"
                    rows="1"
                    [class.message-max-length-exceeded]="draftMessage().length >= messageMaxLength"
                ></textarea>
                <small
                    class="text-input-counter"
                    [class.message-max-length-exceeded]="draftMessage().length >= messageMaxLength"
                >
                    {{ draftMessage().length }} / {{ messageMaxLength }}
                </small>
            </div>
            <button type="submit" [disabled]="draftMessage().length >= messageMaxLength || draftMessage().trim() === ''">
                <i class="fa-regular fa-paper-plane"></i>        
            </button>
        </form>
    </footer>
</article>
