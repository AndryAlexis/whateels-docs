<article class="chat">
    <header class="chat-header">
        <h6>WhatEELBot</h6>
        <button (click)="closeChat()">
            <i class="fa-solid fa-window-minimize"></i>
        </button>
    </header>
    <main class="chat-body" #chatBody>
        <div class="chat-messages">
            @for (message of messages(); track message.id) {
                <div
                    class="message-bubble"
                    [class.whateelbot-bubble]="message.role === 'bot'"
                    [class.user-bubble]="message.role === 'user'"
                    [class.thinking]="message.status === 'thinking'"
                    [class.error]="message.status === 'error'"
                >
                    @if (message.role === 'bot' && message.status === 'thinking') {
                        <span class="loading-spinner"></span>
                    }
                    <p>{{ message.text }}</p>
                </div>
            }
        </div>
    </main>
    <footer class="chat-footer">
        <div class="suggestions">
            <button>What can I ask you?</button>
            <button (click)="openEmailAdmin()">I'd rather to email the admin</button>
        </div>
        <form class="input-group" (submit)="sendMessage($event)">
            <input
                type="text"
                placeholder="Type a message..."
                [value]="draftMessage()"
                (input)="onDraftMessageChange($event)"
            >
            <button type="submit">
                <i class="fa-regular fa-paper-plane"></i>        
            </button>
        </form>
    </footer>
</article>
