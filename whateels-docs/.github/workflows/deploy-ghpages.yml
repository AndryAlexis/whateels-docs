name: Deploy to GitHub Pages

on:
  push:
    branches:
      - vanessa-way

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:ghpages

      - name: Deploy to GitHub Pages (JamesIves)
        uses: JamesIves/github-pages-deploy-action@v4.6.0
        with:
          branch: gh-pages
          folder: dist/whateels-docs/browser
          clean: true
          commit-message: 'ci: deploy gh-pages from vanessa-way'
